# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - lr2-zorenko-saveliev-2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build with dotnet
        run: dotnet build --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      # Install Entity Framework Core CLI for .NET 10
      - name: Install EF Core tool
        run: dotnet tool install --global dotnet-ef --version "10.*"

      # Restore packages required for the Linux migration bundle
      - name: Restore Linux runtime assets
        run: dotnet restore --runtime linux-x64

      # Create executable EF Core migration bundle
      - name: Create migration bundle
        run: >
          dotnet ef migrations bundle
          --runtime linux-x64
          --project DotNetCoreSqlDb.csproj
          --startup-project DotNetCoreSqlDb.csproj
          --output ${{ env.DOTNET_ROOT }}/myapp/migrationsbundle

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5867DE5529AD4333AEE7033C11C87F9C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A5AB72863A3B4D54A81D804A8649ACFE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2B2376CBAB3C4ECA8A142B951A784640 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'lr2-zorenko-saveliev-2026'
          slot-name: 'Production'
          package: .
